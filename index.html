<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0f0f0f;
      --ink-2:     #444;
      --ink-3:     #777;
      --paper:     #faf9f7;
      --surface:   #f2f0ec;
      --line:      #e0ddd8;
      --accent:    #1a1a1a;
      --accent-teal: #0f6e56;
      --accent-warm: #854f0b;
      --radius:    6px;
      --serif:     'DM Serif Display', Georgia, serif;
      --sans:      'DM Sans', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink:     #f0ede8;
        --ink-2:   #bbb;
        --ink-3:   #777;
        --paper:   #111110;
        --surface: #1b1a18;
        --line:    #2e2c28;
        --accent:  #f0ede8;
      }
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.7; }
    ul { list-style: none; }

    /* ── Layout ─────────────────────────────────────────────── */
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section { padding: 80px 0; }
    section + section { border-top: 1px solid var(--line); }

    /* ── Loading ─────────────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--paper);
      font-family: var(--serif);
      font-size: 2rem;
      letter-spacing: 0.1em;
      z-index: 100;
      transition: opacity 0.4s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    /* ── Navigation ─────────────────────────────────────────── */
    nav {
      position: sticky; top: 0;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      z-index: 50;
      padding: 16px 0;
    }
    nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand {
      font-family: var(--serif);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 0.875rem;
      color: var(--ink-2);
    }
    .nav-links a:hover { color: var(--ink); opacity: 1; }

    /* ── Hero ────────────────────────────────────────────────── */
    #hero {
      padding: 120px 0 100px;
      border-bottom: 1px solid var(--line);
    }
    .hero-eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 28px; height: 1px;
      background: var(--ink-3);
    }
    .hero-name {
      font-family: var(--serif);
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .hero-name em { font-style: italic; }
    .hero-bio {
      font-size: 1.1rem;
      color: var(--ink-2);
      max-width: 520px;
      line-height: 1.7;
      margin-bottom: 40px;
      font-weight: 300;
    }
    .hero-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: 1px solid var(--line);
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--ink-2);
      transition: border-color 0.2s, color 0.2s;
    }
    .hero-link:hover {
      border-color: var(--ink);
      color: var(--ink);
      opacity: 1;
    }
    .hero-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

    /* ── Section Header ─────────────────────────────────────── */
    .section-label {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ── Skills ─────────────────────────────────────────────── */
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .skill-tag {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.875rem;
      color: var(--ink-2);
    }

    /* ── Projects ───────────────────────────────────────────── */
    .projects-grid {
      display: grid;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .project-card {
      background: var(--paper);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.15s;
    }
    .project-card:hover { background: var(--surface); }
    .project-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .project-title {
      font-family: var(--serif);
      font-size: 1.25rem;
      line-height: 1.2;
    }
    .project-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .project-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--ink-3);
      font-size: 13px;
      transition: border-color 0.15s, color 0.15s;
    }
    .project-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; }
    .project-action:hover { border-color: var(--ink); color: var(--ink); opacity: 1; }
    .project-desc {
      font-size: 0.9rem;
      color: var(--ink-2);
      font-weight: 300;
      line-height: 1.6;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .project-tag {
      font-size: 0.75rem;
      color: var(--ink-3);
      padding: 2px 10px;
      background: var(--surface);
      border-radius: 100px;
    }
    .featured-badge {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-teal);
      border: 1px solid currentColor;
      padding: 2px 8px;
      border-radius: 100px;
      flex-shrink: 0;
    }

    /* ── Experience ─────────────────────────────────────────── */
    .experience-list { display: flex; flex-direction: column; gap: 40px; }
    .exp-item { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 560px) {
      .exp-item { grid-template-columns: 1fr; gap: 8px; }
    }
    .exp-meta { padding-top: 2px; }
    .exp-company { font-weight: 500; font-size: 0.95rem; }
    .exp-period { font-size: 0.8rem; color: var(--ink-3); margin-top: 4px; }
    .exp-role {
      font-family: var(--serif);
      font-size: 1.15rem;
      margin-bottom: 12px;
    }
    .exp-bullets { display: flex; flex-direction: column; gap: 8px; }
    .exp-bullets li {
      font-size: 0.9rem;
      color: var(--ink-2);
      padding-left: 16px;
      position: relative;
      font-weight: 300;
      line-height: 1.6;
    }
    .exp-bullets li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--ink-3);
      font-size: 0.75rem;
      top: 2px;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--line);
      padding: 32px 0;
    }
    footer .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--ink-3);
    }

    /* ── Animations ─────────────────────────────────────────── */
    .fade-in {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-in.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>

<div id="loader">✦</div>

<nav>
  <div class="wrap">
    <span class="nav-brand" id="nav-brand">Portfolio</span>
    <ul class="nav-links">
      <li><a href="#projects">Projects</a></li>
      <li><a href="#experience">Experience</a></li>
    </ul>
  </div>
</nav>

<main>
  <!-- HERO -->
  <section id="hero">
    <div class="wrap">
      <p class="hero-eyebrow" id="hero-location"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-bio" id="hero-bio"></p>
      <div class="hero-links" id="hero-links"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills">
    <div class="wrap fade-in">
      <p class="section-label">Skills</p>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <div class="wrap fade-in">
      <p class="section-label">Projects</p>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience">
    <div class="wrap fade-in">
      <p class="section-label">Experience</p>
      <div class="experience-list" id="experience-list"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="footer-text"></span>
    <span id="footer-year"></span>
  </div>
</footer>

<script>
  /* ── Icons ───────────────────────────────────────────────── */
  const ICONS = {
    github:   `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
    linkedin: `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`,
    mail:     `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
    twitter:  `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>`,
    external: `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  };

  /* ── Render ───────────────────────────────────────────────── */
  async function load() {
    const res  = await fetch('data.json?v=' + Date.now());
    const data = await res.json();

    // <title> + favicon
    document.title = data.meta.title;
    const favicon = document.querySelector("link[rel='icon']") || document.createElement('link');
    favicon.rel = 'icon'; favicon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='1em' font-size='14'>${data.meta.favicon}</text></svg>`;
    document.head.appendChild(favicon);

    // Nav
    document.getElementById('nav-brand').textContent = data.hero.name.split(' ')[0];

    // Hero
    document.getElementById('hero-location').textContent = data.hero.location;
    const [first, ...rest] = data.hero.name.split(' ');
    document.getElementById('hero-name').innerHTML = `${first} <em>${rest.join(' ')}</em>`;
    document.getElementById('hero-bio').textContent = data.hero.bio;

    const linksEl = document.getElementById('hero-links');
    data.links.forEach(l => {
      const a = document.createElement('a');
      a.href = l.url;
      a.className = 'hero-link';
      a.target = l.url.startsWith('mailto') ? '_self' : '_blank';
      a.rel = 'noopener';
      a.innerHTML = (ICONS[l.icon] || '') + l.label;
      linksEl.appendChild(a);
    });

    // Skills
    const sg = document.getElementById('skills-grid');
    data.skills.forEach(s => {
      const el = document.createElement('span');
      el.className = 'skill-tag';
      el.textContent = s;
      sg.appendChild(el);
    });

    // Projects
    const pg = document.getElementById('projects-grid');
    data.projects.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div class="project-header">
          <h3 class="project-title">${p.title}</h3>
          <div class="project-actions">
            ${p.featured ? `<span class="featured-badge">Featured</span>` : ''}
            ${p.url  ? `<a href="${p.url}"  target="_blank" rel="noopener" class="project-action" title="GitHub">${ICONS.github}</a>` : ''}
            ${p.live ? `<a href="${p.live}" target="_blank" rel="noopener" class="project-action" title="Live demo">${ICONS.external}</a>` : ''}
          </div>
        </div>
        <p class="project-desc">${p.description}</p>
        <div class="project-tags">${p.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</div>
      `;
      pg.appendChild(card);
    });

    // Experience
    const el = document.getElementById('experience-list');
    data.experience.forEach(e => {
      const item = document.createElement('div');
      item.className = 'exp-item';
      item.innerHTML = `
        <div class="exp-meta">
          <p class="exp-company">${e.company}</p>
          <p class="exp-period">${e.period}</p>
        </div>
        <div>
          <p class="exp-role">${e.role}</p>
          <ul class="exp-bullets">${e.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
        </div>
      `;
      el.appendChild(item);
    });

    // Footer
    document.getElementById('footer-text').textContent = data.footer.text;
    document.getElementById('footer-year').textContent = '© ' + new Date().getFullYear();

    // Hide loader
    const loader = document.getElementById('loader');
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 500);

    // Scroll-triggered fade-ins
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }});
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  }

  load().catch(err => {
    document.getElementById('loader').textContent = '⚠ Could not load data.json';
    console.error(err);
  });
</script>
</body>
</html>
